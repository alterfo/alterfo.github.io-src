<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>vacuum-rogues — скоро</title>
  <meta name="description" content="vacuum-rogues — браузерная игра. Скоро здесь.">
  <meta name="robots" content="noindex">
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0;
      height: 100%;
      background: #0f172a;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .wrap {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      padding: 2rem;
      box-sizing: border-box;
      text-align: center;
    }
    .ship { width: 72px; height: 72px; opacity: 0.9; }
    h1 { margin: 0; font-size: clamp(1.5rem, 4vw, 2.25rem); font-weight: 600; letter-spacing: 0.01em; }
    p { margin: 0; color: #94a3b8; font-size: 1.05rem; }
    a.home {
      margin-top: 0.5rem;
      color: #94a3b8;
      text-decoration: none;
      border-bottom: 1px solid #334155;
      padding-bottom: 2px;
      transition: color 0.15s ease, border-color 0.15s ease;
    }
    a.home:hover { color: #e2e8f0; border-color: #475569; }
  </style>
</head>
<body>
  <div class="wrap">
    <svg class="ship" viewBox="0 0 100 100" aria-hidden="true">
      <path d="M50 18 L68 74 Q50 64 32 74 Z" fill="#e2e8f0"/>
      <circle cx="50" cy="40" r="4" fill="#0f172a"/>
      <circle cx="40" cy="82" r="3" fill="#94a3b8"/>
      <circle cx="60" cy="82" r="3" fill="#94a3b8"/>
    </svg>
    <h1>vacuum-rogues</h1>
    <p>Скоро&nbsp;— игра приземлится здесь.</p>
    <a class="home" href="/">← на главную</a>

</body>
</html>
