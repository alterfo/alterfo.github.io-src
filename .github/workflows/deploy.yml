name: Deploy

on:
  push:
    branches: [ master ]
  # The game repo (alterfo/vacuum-rogues) fires this on its own push to master so a game
  # change auto-rebuilds the site (no manual submodule bump). See README → "Авто-подхват
  # изменений игры" for the token setup in the game repo.
  repository_dispatch:
    types: [vacuum-rogues-updated]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      with:
        # vacuum-rogues is a PRIVATE submodule (alterfo/vacuum-rogues, SSH URL in
        # .gitmodules); the default GITHUB_TOKEN can't read another private repo. Fetch
        # submodules ONLY when the read-only deploy-key secret exists — otherwise skip the
        # fetch entirely so a missing key never hard-fails the main site deploy. With no key,
        # /vacuum-rogues/ stays a 404 and the home-page center mark hides itself (HEAD probe).
        # See docs/plans/20260621-vacuum-rogues-deploy-and-donut-logo.md for the secret setup.
        submodules: ${{ secrets.VACUUM_ROGUES_DEPLOY_KEY != '' && 'recursive' || 'false' }}
        ssh-key: ${{ secrets.VACUUM_ROGUES_DEPLOY_KEY }}

    - name: Setup emsdk
      uses: mymindstorm/setup-emsdk@v14

    - name: Use Node.js 22
      uses: actions/setup-node@v5
      with:
        node-version: 22

    - name: Install dependencies
      run: npm ci

    - name: Build AR Engine WASM
      run: |
        if [ -d "ar-engine/engine" ]; then
          make -C ar-engine/engine/ || echo "Warning: WASM build failed, skipping"
        fi

    # The pose model (~10.8 MB) is gitignored; fetch it at build time so /openpose
    # works on prod. Cached between runs — Google's "latest" URL rarely changes.
    - name: Cache MediaPipe pose model
      uses: actions/cache@v4
      with:
        path: public/mediapipe/pose_landmarker_full.task
        key: mediapipe-pose-landmarker-full-float16-v1

    - name: Download MediaPipe pose model
      run: |
        if [ ! -f public/mediapipe/pose_landmarker_full.task ]; then
          curl -fL "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/latest/pose_landmarker_full.task" \
            -o public/mediapipe/pose_landmarker_full.task
        fi

    # npm run build (NOT npx vitepress build): the prebuild hook runs
    # mediapipe:copy, which copies the gitignored WASM runtime from
    # node_modules into public/mediapipe/wasm/ — without it /openpose 404s.
    - name: Build VitePress
      run: npm run build

    - name: Copy AR Engine assets
      run: |
        if [ -d "ar-engine/web" ]; then
          mkdir -p .vitepress/dist/ar
          cp -r ar-engine/web/. .vitepress/dist/ar/
        fi

    # Serve the game at /vacuum-rogues/ (mirrors the /ar/ subpath). GATED + non-fatal:
    # runs only if the private submodule actually checked out (needs the deploy-key secret —
    # see the checkout step), and continue-on-error guarantees a missing/failed game build
    # never breaks the main site deploy. The build runs `vite build` directly (skips `tsc`,
    # whose type errors must not gate a deploy) with the subpath base, then copies into dist/.
    # Until the key lands, /vacuum-rogues/ doesn't exist and the home center mark stays hidden.
    - name: Build & copy vacuum-rogues game
      continue-on-error: true
      env:
        VR_DEPLOY_KEY: ${{ secrets.VACUUM_ROGUES_DEPLOY_KEY }}
      run: |
        if [ ! -f vacuum-rogues/package.json ]; then
          echo "vacuum-rogues submodule not checked out (no deploy key yet) — no game served"
          exit 0
        fi
        # Build the LATEST game commit, not the pinned submodule SHA, so a game push
        # (delivered via repository_dispatch) ships without bumping the pin in this repo.
        # Uses the same read-only deploy key for the private fetch (.gitmodules pins
        # branch=master). If the fetch fails, fall back to the pinned commit.
        if [ -n "$VR_DEPLOY_KEY" ]; then
          mkdir -p ~/.ssh && printf '%s\n' "$VR_DEPLOY_KEY" > ~/.ssh/vr_key && chmod 600 ~/.ssh/vr_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/vr_key -o StrictHostKeyChecking=accept-new"
          git submodule update --remote --recursive vacuum-rogues \
            || echo "Warning: could not fast-forward to latest game — building the pinned commit"
        fi
        ( cd vacuum-rogues && npm ci && npx vite build --base=/vacuum-rogues/ ) \
          && mkdir -p .vitepress/dist/vacuum-rogues \
          && cp -r vacuum-rogues/dist/. .vitepress/dist/vacuum-rogues/ \
          && echo "vacuum-rogues built and copied" \
          || echo "Warning: vacuum-rogues build/copy failed — no game served"

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        deploy_key: ${{ secrets.DEPLOY_KEY }}
        external_repository: alterfo/alterfo.github.io
        publish_branch: master
        publish_dir: ./.vitepress/dist
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'
        commit_message: 'deploy'
